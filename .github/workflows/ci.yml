name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install

      - name: Security self-checks
        run: |
          node backend/middleware/rateLimit.js
          node backend/middleware/signedUploads.js

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev || true
