name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — continuous scanning

# Required so Snyk results can be written into the Security → Code scanning tab.
permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG: ${{ vars.SNYK_ORG || '90e235c0-ec31-4e8a-bd5a-2e843927566c' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm install --prefix frontend

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk monitor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk monitor --all-projects --org=$SNYK_ORG

      - name: Snyk Open Source scan
        id: oss
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk test --all-projects --org=$SNYK_ORG --severity-threshold=high --sarif-file-output=snyk-oss.sarif

      - name: Upload Open Source results
        if: always() && steps.oss.outcome != 'skipped' && hashFiles('snyk-oss.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      - name: Snyk Code scan
        id: code
        if: env.SNYK_TOKEN != ''
        continue-on-error: true
        run: snyk code test --org=$SNYK_ORG --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code results
        if: always() && steps.code.outcome != 'skipped' && hashFiles('snyk-code.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Email on high-severity findings
        if: (steps.oss.outcome == 'failure' || steps.code.outcome == 'failure') && env.MAIL_TO != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[Barcode Tracker] High-severity security findings on ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_TO }}
          from: Barcode Tracker CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            Snyk found high-or-above severity issues.

            Repo:   ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Alerts: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning

      - name: Fail build on critical vulnerabilities
        if: env.SNYK_TOKEN != ''
        run: |
          code=0
          snyk test --all-projects --org=$SNYK_ORG --severity-threshold=critical || code=$?
          if [ "$code" = "1" ]; then
            echo "::error::Snyk found critical vulnerabilities"; exit 1
          elif [ "$code" != "0" ]; then
            echo "::warning::Snyk could not complete (exit $code: auth/config) — not blocking the build"
          fi
