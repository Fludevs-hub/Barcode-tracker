name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — continuous scanning

# Required so Snyk results can be written into the Security → Code scanning tab.
permissions:
  contents: read
  security-events: write

jobs:
  snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npm install --prefix frontend

      - name: Install Snyk CLI
        run: npm install -g snyk

      # --- Open Source (dependencies) → SARIF report ---
      - name: Snyk Open Source scan
        continue-on-error: true # report, don't fail the build
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-oss.sarif

      - name: Upload Open Source results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      # --- Snyk Code (SAST on our source) → SARIF report ---
      # Requires Snyk Code to be enabled on your Snyk org (free tier supports it).
      - name: Snyk Code scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif

      - name: Upload Snyk Code results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
